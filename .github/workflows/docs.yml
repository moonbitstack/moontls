name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/gen_api.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # The demonstration page calls the library itself, so the engine is compiled here and never
      # checked in: `docs/engine/` is in `.gitignore`.
      - name: build the demonstration engine
        run: |
          moon update
          moon build --target js --release src/examples/browser
          mkdir -p docs/engine
          cp _build/js/release/build/moonbitstack/moontls/examples/browser/browser.js docs/engine/moontls.js

      # The reference is generated from the interface files; deploy only the version that matches
      # the sources this run checked out.
      - name: the reference is current
        run: |
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
